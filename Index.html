<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>덧셈 연습</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  background:linear-gradient(135deg,#667eea,#764ba2);
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;padding:16px 12px 30px;
}

/* 상단 */
.top{width:100%;max-width:440px;margin-bottom:14px;}
.prog-lbl{font-size:14px;color:rgba(255,255,255,.9);font-weight:700;text-align:center;margin-bottom:7px;}
.prog-bar{background:rgba(255,255,255,.3);border-radius:99px;height:12px;}
.prog-fill{background:#fff;height:100%;border-radius:99px;transition:width .5s cubic-bezier(.34,1.56,.64,1);}
.score-row{display:flex;justify-content:center;margin-top:8px;}
.score-badge{background:rgba(255,255,255,.2);color:#fff;padding:5px 14px;border-radius:20px;font-size:13px;font-weight:700;}

/* 카드 */
.card{
  width:100%;max-width:440px;background:#fff;border-radius:28px;
  padding:24px 20px 22px;
  box-shadow:0 20px 60px rgba(0,0,0,.2);text-align:center;
  animation:slideIn .35s cubic-bezier(.34,1.56,.64,1);
}
@keyframes slideIn{from{transform:translateY(30px) scale(.92);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}

.q-num{display:inline-block;background:#f0f4ff;color:#4f46e5;font-size:13px;font-weight:700;padding:4px 14px;border-radius:99px;margin-bottom:14px;}

/* 문제식 */
.q-box{background:linear-gradient(135deg,#f0f4ff,#ede9fe);border-radius:18px;padding:18px 12px 14px;margin-bottom:16px;}
.q-eq{font-size:52px;font-weight:900;color:#1e1b4b;letter-spacing:2px;
  display:flex;align-items:center;justify-content:center;gap:8px;}
.op{color:#7c3aed;}
#qans{color:#c7d2fe;font-size:48px;min-width:60px;}

/* 손글씨 캔버스 영역 */
.write-area{margin-bottom:14px;}
.write-lbl{font-size:13px;color:#64748b;font-weight:600;margin-bottom:8px;
  display:flex;align-items:center;justify-content:center;gap:6px;}
.canvas-wrap{
  position:relative;display:inline-block;
  border:3px solid #e0e7ff;border-radius:20px;
  background:#fafbff;overflow:hidden;
  box-shadow:inset 0 2px 8px rgba(79,70,229,.08);
}
canvas{
  display:block;touch-action:none;cursor:crosshair;
  width:260px;height:130px;
}
.clear-btn{
  position:absolute;top:8px;right:8px;
  background:#f1f5f9;border:none;border-radius:10px;
  padding:5px 10px;font-size:12px;color:#64748b;cursor:pointer;
  font-weight:700;
}
.clear-btn:active{background:#e2e8f0;}

/* 인식 결과 미리보기 */
.recog-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px;min-height:36px;}
.recog-box{
  background:#f0f4ff;border-radius:12px;padding:6px 16px;
  font-size:28px;font-weight:900;color:#4f46e5;
  min-width:60px;text-align:center;
  transition:all .2s;
}
.recog-box.empty{color:#c7d2fe;font-size:18px;font-weight:400;}
.recog-box.loading{color:#a5b4fc;}
.thinking{font-size:12px;color:#a5b4fc;display:none;}

/* 확인 버튼 */
.check-btn{
  width:100%;padding:15px;font-size:19px;font-weight:800;
  border:none;border-radius:16px;cursor:pointer;
  background:linear-gradient(135deg,#4f46e5,#7c3aed);
  color:#fff;transition:opacity .15s,transform .1s;
  box-shadow:0 4px 14px rgba(79,70,229,.35);
  margin-bottom:10px;
}
.check-btn:active{transform:scale(.97);}
.check-btn:disabled{background:#d1d5db;box-shadow:none;color:#9ca3af;cursor:not-allowed;}

/* 결과 */
.result{
  padding:12px;border-radius:14px;font-size:15px;font-weight:700;
  display:none;animation:fadeIn .25s;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.result.ok{background:#f0fdf4;color:#166534;display:block;}
.result.ng{background:#fef2f2;color:#991b1b;display:block;}
.result.warn{background:#fffbeb;color:#92400e;display:block;}

/* 팝업 */
#popup{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9999;align-items:center;justify-content:center;}
.popup-box{background:#fff;border-radius:28px;padding:32px 24px 26px;max-width:320px;width:90%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:popIn .4s cubic-bezier(.34,1.56,.64,1);}
@keyframes popIn{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.pop-icon{font-size:64px;margin-bottom:8px;}
.pop-title{font-size:24px;font-weight:900;color:#1e1b4b;margin-bottom:4px;}
.pop-sub{font-size:14px;color:#64748b;margin-bottom:12px;}
.pop-stars{font-size:32px;letter-spacing:4px;margin-bottom:16px;}
.pop-time-box{background:linear-gradient(135deg,#eff6ff,#ede9fe);border-radius:16px;padding:16px;margin-bottom:14px;}
.pop-time-lbl{font-size:12px;color:#64748b;margin-bottom:4px;}
.pop-time{font-size:46px;font-weight:900;color:#4f46e5;letter-spacing:3px;}
.pop-score{font-size:15px;color:#374151;font-weight:600;margin-bottom:20px;}
.pop-btn{width:100%;padding:14px;font-size:16px;font-weight:800;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border:none;border-radius:14px;cursor:pointer;}
</style>
</head>
<body>

<div class="top">
  <div class="prog-lbl" id="prog-lbl">1 / 30 문제</div>
  <div class="prog-bar"><div class="prog-fill" id="prog-fill" style="width:3.3%"></div></div>
  <div class="score-row"><div class="score-badge">⭐ 정답 <span id="score">0</span>개</div></div>
</div>

<div class="card" id="card">
  <div class="q-num" id="q-num">문제 1</div>
  <div class="q-box">
    <div class="q-eq">
      <span id="qa"></span>
      <span class="op">+</span>
      <span id="qb"></span>
      <span class="op">=</span>
      <span id="qans">?</span>
    </div>
  </div>

  <!-- 손글씨 영역 -->
  <div class="write-area">
    <div class="write-lbl">✏️ 여기에 답을 써주세요</div>
    <div class="canvas-wrap">
      <canvas id="canvas" width="520" height="260"></canvas>
      <button class="clear-btn" onclick="clearCanvas()">지우기</button>
    </div>
    <div class="recog-row">
      <span style="font-size:13px;color:#64748b;font-weight:600;">인식된 답:</span>
      <span class="recog-box empty" id="recog-box">—</span>
      <span class="thinking" id="thinking">읽는 중...</span>
    </div>
  </div>

  <button class="check-btn" id="check-btn" onclick="checkAnswer()" disabled>✅ 확인</button>
  <div class="result" id="result"></div>
</div>

<div id="popup">
  <div class="popup-box">
    <div class="pop-icon">🎉</div>
    <div class="pop-title">30문제 완성!</div>
    <div class="pop-sub">모든 문제를 다 풀었어요!</div>
    <div class="pop-stars" id="pop-stars">⭐⭐⭐</div>
    <div class="pop-time-box">
      <div class="pop-time-lbl">⏱ 총 걸린 시간</div>
      <div class="pop-time" id="pop-time">00:00</div>
    </div>
    <div class="pop-score" id="pop-score">정답 0개 / 30문제</div>
    <button class="pop-btn" onclick="restartGame()">🔄 다시 풀기</button>
  </div>
</div>

<script>
// ──────────────────────────────────────
//  문제 생성
// ──────────────────────────────────────
function makeQ(){
  const p=[];
  for(let a=0;a<=9;a++) for(let b=0;b<=9;b++) p.push([a,b]);
  for(let i=p.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[p[i],p[j]]=[p[j],p[i]];}
  return p.slice(0,30).map(([a,b])=>({a,b,ans:a+b}));
}

// ──────────────────────────────────────
//  타이머 (화면엔 안 보임)
// ──────────────────────────────────────
const T={s:0,el:0,run:false,iv:null};
function pad(n){return String(n).padStart(2,'0');}
function fmtT(ms){const s=Math.floor(ms/1000);return pad(Math.floor(s/60))+':'+pad(s%60);}
function startTimer(){T.s=Date.now();T.el=0;T.run=true;if(T.iv)clearInterval(T.iv);T.iv=setInterval(()=>{if(T.run)T.el=Date.now()-T.s;},500);}
function stopTimer(){T.run=false;T.el=Date.now()-T.s;clearInterval(T.iv);}

// ──────────────────────────────────────
//  Canvas 손글씨
// ──────────────────────────────────────
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
let drawing=false, hasMark=false, recognizedVal=null;
let recogTimer=null;

function setupCanvas(){
  ctx.strokeStyle='#1e1b4b';
  ctx.lineWidth=14;
  ctx.lineCap='round';
  ctx.lineJoin='round';
  ctx.clearRect(0,0,canvas.width,canvas.height);
}

function getPos(e){
  const r=canvas.getBoundingClientRect();
  const scaleX=canvas.width/r.width;
  const scaleY=canvas.height/r.height;
  if(e.touches){
    return{x:(e.touches[0].clientX-r.left)*scaleX,y:(e.touches[0].clientY-r.top)*scaleY};
  }
  return{x:(e.clientX-r.left)*scaleX,y:(e.clientY-r.top)*scaleY};
}

canvas.addEventListener('mousedown',e=>{drawing=true;hasMark=true;const p=getPos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);});
canvas.addEventListener('mousemove',e=>{if(!drawing)return;const p=getPos(e);ctx.lineTo(p.x,p.y);ctx.stroke();});
canvas.addEventListener('mouseup',()=>{if(drawing){drawing=false;scheduleRecog();}});
canvas.addEventListener('mouseleave',()=>{if(drawing){drawing=false;scheduleRecog();}});

canvas.addEventListener('touchstart',e=>{e.preventDefault();drawing=true;hasMark=true;const p=getPos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();if(!drawing)return;const p=getPos(e);ctx.lineTo(p.x,p.y);ctx.stroke();},{passive:false});
canvas.addEventListener('touchend',e=>{e.preventDefault();if(drawing){drawing=false;scheduleRecog();}},{passive:false});

function clearCanvas(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  hasMark=false; recognizedVal=null;
  document.getElementById('recog-box').textContent='—';
  document.getElementById('recog-box').className='recog-box empty';
  document.getElementById('thinking').style.display='none';
  document.getElementById('check-btn').disabled=true;
  document.getElementById('qans').textContent='?';
  document.getElementById('qans').style.color='#c7d2fe';
  if(recogTimer) clearTimeout(recogTimer);
}

// ──────────────────────────────────────
//  손글씨 인식 (Claude API)
// ──────────────────────────────────────
function scheduleRecog(){
  if(recogTimer) clearTimeout(recogTimer);
  recogTimer=setTimeout(recognizeHandwriting, 600);  // 0.6초 후 인식
}

async function recognizeHandwriting(){
  if(!hasMark) return;
  const box=document.getElementById('recog-box');
  const thinking=document.getElementById('thinking');
  box.textContent='…';
  box.className='recog-box loading';
  thinking.style.display='inline';

  // canvas → base64 (흰 배경으로 합성)
  const tmp=document.createElement('canvas');
  tmp.width=canvas.width; tmp.height=canvas.height;
  const tc=tmp.getContext('2d');
  tc.fillStyle='#ffffff';
  tc.fillRect(0,0,tmp.width,tmp.height);
  tc.drawImage(canvas,0,0);
  const b64=tmp.toDataURL('image/png').split(',')[1];

  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-6',
        max_tokens:50,
        messages:[{
          role:'user',
          content:[
            {type:'image',source:{type:'base64',media_type:'image/png',data:b64}},
            {type:'text',text:'이 이미지에 어린이가 손으로 쓴 숫자가 있습니다. 숫자만 읽고 숫자 하나만 답하세요. 숫자가 없거나 읽을 수 없으면 "?"라고만 답하세요. 다른 말은 절대 하지 마세요.'}
          ]
        }]
      })
    });
    const data=await res.json();
    const txt=(data.content?.[0]?.text||'?').trim().replace(/[^0-9?]/g,'');
    const num=parseInt(txt);
    thinking.style.display='none';
    if(!isNaN(num)&&num>=0&&num<=18){
      recognizedVal=num;
      box.textContent=num;
      box.className='recog-box';
      // 문제식의 ? 자리에도 표시
      document.getElementById('qans').textContent=num;
      document.getElementById('qans').style.color='#4f46e5';
      document.getElementById('check-btn').disabled=false;
    } else {
      recognizedVal=null;
      box.textContent='?';
      box.className='recog-box empty';
      document.getElementById('qans').textContent='?';
      document.getElementById('qans').style.color='#c7d2fe';
      document.getElementById('check-btn').disabled=true;
    }
  } catch(err){
    thinking.style.display='none';
    box.textContent='!';
    box.className='recog-box empty';
    recognizedVal=null;
    document.getElementById('check-btn').disabled=true;
  }
}

// ──────────────────────────────────────
//  게임 상태
// ──────────────────────────────────────
let QS=[], cur=0, correctCount=0;

function init(){
  QS=makeQ(); cur=0; correctCount=0;
  document.getElementById('score').textContent='0';
  startTimer();
  showQ();
}

function showQ(){
  const q=QS[cur];
  document.getElementById('q-num').textContent='문제 '+(cur+1);
  document.getElementById('qa').textContent=q.a;
  document.getElementById('qb').textContent=q.b;
  document.getElementById('qans').textContent='?';
  document.getElementById('qans').style.color='#c7d2fe';
  document.getElementById('prog-lbl').textContent=(cur+1)+' / 30 문제';
  document.getElementById('prog-fill').style.width=((cur+1)/30*100)+'%';
  document.getElementById('result').style.display='none';
  document.getElementById('check-btn').disabled=true;

  // 카드 애니메이션
  const card=document.getElementById('card');
  card.style.animation='none'; void card.offsetWidth;
  card.style.animation='slideIn .35s cubic-bezier(.34,1.56,.64,1)';

  clearCanvas();
  setupCanvas();
}

// ──────────────────────────────────────
//  정답 확인
// ──────────────────────────────────────
function checkAnswer(){
  if(recognizedVal===null) return;
  const q=QS[cur];
  const ok=(recognizedVal===q.ans);
  const res=document.getElementById('result');
  document.getElementById('check-btn').disabled=true;

  if(ok){
    correctCount++;
    document.getElementById('score').textContent=correctCount;
    document.getElementById('qans').style.color='#22c55e';
    res.className='result ok';
    res.textContent='🎉 정답이에요!  '+q.a+' + '+q.b+' = '+q.ans;
    res.style.display='block';
    setTimeout(()=>nextQ(), 1100);
  } else {
    res.className='result ng';
    const wrong=recognizedVal;
    res.textContent='🤔 '+wrong+'이(가) 아니에요. 다시 써봐요!';
    res.style.display='block';
    setTimeout(()=>{
      res.style.display='none';
      clearCanvas();
    }, 1000);
  }
}

function nextQ(){
  cur++;
  if(cur>=30){stopTimer();showPopup();return;}
  showQ();
}

function showPopup(){
  document.getElementById('pop-time').textContent=fmtT(T.el);
  document.getElementById('pop-score').textContent='정답 '+correctCount+'개 / 30문제';
  const r=correctCount/30;
  document.getElementById('pop-stars').textContent=r>=0.9?'⭐⭐⭐':r>=0.7?'⭐⭐':'⭐';
  document.getElementById('popup').style.display='flex';
}

function restartGame(){
  document.getElementById('popup').style.display='none';
  init();
}

setupCanvas();
init();
</script>
</body>
</html>
